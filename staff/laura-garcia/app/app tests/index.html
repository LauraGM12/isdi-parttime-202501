<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Laura</title>
    <link rel="stylesheet" href="index.css"> <!-- Estilos generales -->
</head>
<body>
    <script src="lib.js"></script>  <!-- Funciones auxiliares -->
    <script src="data.js"></script> <!-- Almacenamiento y obtención de datos -->
    <script src="logics.js"></script> <!-- Lógica de la app -->
    <script src="pages.js"></script>  <!-- Manejo de vistas y navegación -->
    <script src="main.js"></script>  <!-- Inicio y control principal -->

    <script src="index-version1-flors.js"></script> <!--Código de prueba Flors comentado-->


    <script>
        document.addEventListener("DOMContentLoaded", function () {
          const modal = document.querySelector(".modal");
          const closeModal = document.querySelector(".close");
      
          // Función para cerrar el modal
          function closeModalHandler() {
            modal.style.display = "none";
          }
      
          // Cierra el modal al hacer clic en la 'X'
          if (closeModal) {
            closeModal.addEventListener("click", closeModalHandler);
          }
      
          // Cierra el modal al hacer clic fuera de él
          window.addEventListener("click", function (event) {
            if (event.target === modal) {
              closeModalHandler();
            }
          });
        });
      </script>   
</body>
</html>
